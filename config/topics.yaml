# Web design agency niche — content topics for an agency that uses Instagram
# to guide and educate clients about web design, UX, and conversion.
#
# Each topic rotates daily (7 topics = weekly cycle). Each topic has 6+ seed
# facts; we rotate one per day. With Groq enabled, the seed fact is sent to
# the LLM which rewrites it into a polished Instagram caption + image headline
# + 3-5 hashtags. With Groq disabled (or on error), the seed fact is used
# verbatim as a deterministic fallback.

topics:
  - title: "UX Principle"
    facts:
      - "Users scan pages in an F-pattern, not read word-by-word — design for scanning, not reading."
      - "Hick's Law: more choices = slower decisions. Limit navigation to 5-7 top-level items."
      - "The 3-click rule is a myth, but the principle holds: don't make users hunt for the next step."
      - "Average attention span on a homepage is 5-8 seconds. Your hero must communicate value instantly."
      - "Forms with fewer fields convert better. Remove every field that isn't strictly required."
      - "Error messages should explain what went wrong and how to fix it — never just say 'Invalid input'."
    hashtags: ["#uxdesign", "#userexperience", "#webdesign"]

  - title: "Conversion Tip"
    facts:
      - "A single, prominent CTA button outperforms multiple competing CTAs by up to 371%."
      - "Page load time under 2 seconds lifts conversion rates by 15-20% on mobile."
      - "Trust signals (testimonials, certifications, secure badges) near the CTA reduce bounce."
      - "Above-the-fold content drives 80% of first impressions — make it count, don't waste it on carousels."
      - "Whitespace around a CTA increases click-through rate by roughly 20%."
      - "Social proof above the fold (logos, ratings) increases form submissions by 15-30%."
    hashtags: ["#conversion", "#cro", "#webdesign"]

  - title: "Typography Tip"
    facts:
      - "Body text should be at least 16px on desktop and 18px on mobile for comfortable reading."
      - "Line height of 1.5-1.6x the font size improves readability by 20% on long-form content."
      - "Limit to 2 font families per site — one for headings, one for body. More looks amateur."
      - "Contrast ratio of 4.5:1 between text and background is the WCAG AA minimum for body text."
      - "Sans-serif fonts read better on screens; serif fonts read better in print. Pick accordingly."
      - "Avoid all-caps for body text — it cuts reading speed by 10-30%."
    hashtags: ["#typography", "#webdesign", "#designsystems"]

  - title: "Color & Visual Design"
    facts:
      - "Stick to a 60-30-10 color ratio: 60% primary, 30% secondary, 10% accent — it always looks balanced."
      - "Blue builds trust (banks, tech). Red creates urgency (sales, food). Green implies growth and eco."
      - "Use one accent color for all interactive elements — it teaches users what's clickable."
      - "Gradients add depth but hurt accessibility if text contrast drops below 4.5:1."
      - "Color-blind users miss red/green distinctions — always pair color with text or icon cues."
      - "Pure black (#000) on pure white (#FFF) causes eye strain on long reads — use #1A1A1A on #FAFAFA."
    hashtags: ["#colorttheory", "#visualdesign", "#webdesign"]

  - title: "Page Speed"
    facts:
      - "A 1-second delay in page load reduces conversions by 7% and customer satisfaction by 16%."
      - "Images are 60% of average page weight. Compress them with WebP or AVIF to cut 30-50%."
      - "Lazy-loading below-the-fold images cuts initial load time by 30-50% on long pages."
      - "Render-blocking CSS delays first paint. Inline critical CSS, defer the rest."
      - "Cumulative Layout Shift (CLS) below 0.1 means users won't see content jump as it loads."
      - "A Content Delivery Network (CDN) reduces TTFB by 40-60% for global visitors."
    hashtags: ["#pagespeed", "#webperformance", "#webdev"]

  - title: "Mobile-First"
    facts:
      - "60%+ of web traffic is mobile. If your site isn't mobile-first, you're losing the majority."
      - "Touch targets should be at least 44x44px — Apple's HIG and Google's M3 both require this."
      - "Sticky headers on mobile should be under 60px tall — they eat viewport otherwise."
      - "Forms with autofill attributes (autocomplete='email') cut mobile form time by 30%."
      - "Avoid hover-only interactions on mobile — there's no hover on a touchscreen."
      - "Test on real devices, not just Chrome DevTools. Real latency reveals real problems."
    hashtags: ["#mobilefirst", "#responsivedesign", "#webdesign"]

  - title: "SEO Foundation"
    facts:
      - "Title tags under 60 chars and meta descriptions under 155 chars avoid truncation in SERPs."
      - "One H1 per page. Use H2-H6 to create a logical outline — Google uses this to understand structure."
      - "Descriptive alt text on every image helps SEO and accessibility simultaneously."
      - "Page speed is a confirmed Google ranking factor since 2018 — Core Web Vitals matter."
      - "Internal linking distributes page authority. Link new posts to 2-3 relevant older pages."
      - "Schema markup (JSON-LD) gets you rich snippets — they boost CTR by 20-30% on average."
    hashtags: ["#seo", "#webdev", "#marketing"]

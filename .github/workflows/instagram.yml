name: Instagram Automation

# Manual trigger + daily schedule.
# Cron is in UTC. "30 12 * * *" = 12:30 UTC every day.
# Adjust to your liking -- keep it <= once per day to avoid spam.
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override (YYYY-MM-DD). Defaults to today UTC."
        required: false
        default: ""
      dry_run:
        description: "Dry-run: validate everything but skip the Composio publish call."
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "30 12 * * *"

# The workflow commits the generated image and the updated history.json back
# to the repo, so we need write access.
permissions:
  contents: write

concurrency:
  group: instagram-automation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Never print these. They are masked in logs automatically by GitHub Actions
      # because they come from secrets.* -- but we still never echo them.
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      # Groq (OpenAI-compatible API) for AI caption generation. Optional --
      # if absent or invalid, generate_content.py falls back to deterministic content.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need the full history to push back safely.
          fetch-depth: 0
          # Use the workflow's default token (not the PAT).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "date=${{ github.event.inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate content
        run: |
          python scripts/generate_content.py --date "${{ steps.date.outputs.date }}" --out-dir content

      - name: Commit generated image to repo (for public raw URL)
        # The image must be reachable by Instagram's servers. Since this repo
        # is public, raw.githubusercontent.com works. We commit the image,
        # then read back the raw URL.
        run: |
          DATE="${{ steps.date.outputs.date }}"
          IMAGE_PATH="content/images/${DATE}.png"
          if [ -f "$IMAGE_PATH" ]; then
            git add "$IMAGE_PATH"
            if git diff --cached --quiet; then
              echo "[INFO] Image unchanged; no commit needed."
            else
              git commit -m "chore(content): generated image for ${DATE}"
              git push
              echo "[INFO] Image pushed. Waiting 20s for raw URL CDN propagation..."
              sleep 20
            fi
          else
            echo "[ERROR] Image file not found at $IMAGE_PATH" && exit 1
          fi

      - name: Write public raw URL into manifest
        # Build the canonical raw URL. We use the explicit commit SHA URL to
        # bypass any CDN caching of the branch-named URL.
        id: url
        run: |
          DATE="${{ steps.date.outputs.date }}"
          SHA=$(git rev-parse HEAD)
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${SHA}/content/images/${DATE}.png"
          echo "image_url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "[INFO] Image URL: $RAW_URL"

          # Patch the manifest with the URL
          python - <<PY
          import json, os
          date = "${DATE}"
          path = f"content/{date}.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["image_url"] = "${RAW_URL}"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"[INFO] Patched {path} with image_url")
          PY

      - name: Publish via Composio
        id: publish
        run: |
          DATE="${{ steps.date.outputs.date }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/publish_instagram.py \
            --manifest "content/${DATE}.json" \
            --history "content/history.json" \
            $DRY_FLAG

      - name: Commit history & manifest
        if: always()
        run: |
          DATE="${{ steps.date.outputs.date }}"
          git add "content/history.json" "content/${DATE}.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[INFO] No history/manifest changes to commit."
          else
            git commit -m "chore(content): record publication for ${DATE}"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Instagram Automation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** ${{ steps.date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image URL:** ${{ steps.url.outputs.image_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Publish via Composio** step above for detailed logs." >> "$GITHUB_STEP_SUMMARY"

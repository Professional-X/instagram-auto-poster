name: Instagram Automation

# Manual trigger + 4 daily scheduled runs at peak IST engagement hours.
# Cron is in UTC. IST = UTC + 5:30.
#   08:00 IST = 02:30 UTC  -> slot 1 (morning)
#   12:30 IST = 07:00 UTC  -> slot 2 (lunch)
#   18:00 IST = 12:30 UTC  -> slot 3 (evening)
#   20:30 IST = 15:00 UTC  -> slot 4 (night)
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override (YYYY-MM-DD). Defaults to today UTC."
        required: false
        default: ""
      slot_override:
        description: "Slot 1-4 (1=morning, 2=lunch, 3=evening, 4=night). Defaults to auto from current UTC hour."
        required: false
        default: ""
      dry_run:
        description: "Dry-run: validate everything but skip the Composio publish call."
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "30 2 * * *"    # 08:00 IST - slot 1 (morning)
    - cron: "0 7 * * *"     # 12:30 IST - slot 2 (lunch)
    - cron: "30 12 * * *"   # 18:00 IST - slot 3 (evening)
    - cron: "0 15 * * *"    # 20:30 IST - slot 4 (night)

permissions:
  contents: write

# Allow concurrent runs across different slots, but never let the same slot
# run twice at once (cancels the older one).
concurrency:
  group: instagram-automation-${{ github.event.inputs.slot_override || 'auto' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run date and slot
        id: meta
        run: |
          # Date
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "date=${{ github.event.inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

          # Slot: from input, or auto-compute from current UTC hour
          SLOT_INPUT="${{ github.event.inputs.slot_override }}"
          if [ -n "$SLOT_INPUT" ]; then
            SLOT="$SLOT_INPUT"
          else
            # Map UTC hour to slot based on the 4 cron schedules above
            UTC_HOUR=$(date -u +%H)
            UTC_MIN=$(date -u +%M)
            # 02:30 UTC -> slot 1, 07:00 -> slot 2, 12:30 -> slot 3, 15:00 -> slot 4
            # Use a window of +/- 1 hour around each scheduled time to be safe
            case "$UTC_HOUR" in
              01|02|03) SLOT=1 ;;   # around 02:30 UTC (08:00 IST morning)
              06|07|08) SLOT=2 ;;   # around 07:00 UTC (12:30 IST lunch)
              11|12|13) SLOT=3 ;;   # around 12:30 UTC (18:00 IST evening)
              14|15|16) SLOT=4 ;;   # around 15:00 UTC (20:30 IST night)
              *) SLOT=1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "[INFO] Date: ${{ steps.meta.outputs.date }}  Slot: $SLOT"

      - name: Generate content
        run: |
          python scripts/generate_content.py \
            --date "${{ steps.meta.outputs.date }}" \
            --slot "${{ steps.meta.outputs.slot }}" \
            --out-dir content

      - name: Commit generated image to repo (for public raw URL)
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          IMAGE_PATH="content/images/${DATE}-${SLOT}.png"
          if [ -f "$IMAGE_PATH" ]; then
            bash scripts/git_push_retry.sh "chore(content): generated image for ${DATE} slot ${SLOT}" "$IMAGE_PATH"
            echo "[INFO] Waiting 20s for raw URL CDN propagation..."
            sleep 20
          else
            echo "[ERROR] Image file not found at $IMAGE_PATH" && exit 1
          fi

      - name: Write public raw URL into manifest
        id: url
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          SHA=$(git rev-parse HEAD)
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${SHA}/content/images/${DATE}-${SLOT}.png"
          echo "image_url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "[INFO] Image URL: $RAW_URL"

          python - <<PY
          import json
          date = "${DATE}"
          slot = "${SLOT}"
          path = f"content/{date}-{slot}.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["image_url"] = "${RAW_URL}"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"[INFO] Patched {path} with image_url")
          PY

      - name: Publish via Composio
        id: publish
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/publish_instagram.py \
            --manifest "content/${DATE}-${SLOT}.json" \
            --history "content/history.json" \
            $DRY_FLAG

      - name: Commit history & manifest
        if: always()
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          bash scripts/git_push_retry.sh "chore(content): record publication for ${DATE} slot ${SLOT}" "content/history.json" "content/${DATE}-${SLOT}.json" || true

      - name: Summary
        if: always()
        run: |
          echo "### Instagram Automation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** ${{ steps.meta.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Slot:** ${{ steps.meta.outputs.slot }} (1=morning 08:00 IST, 2=lunch 12:30 IST, 3=evening 18:00 IST, 4=night 20:30 IST)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image URL:** ${{ steps.url.outputs.image_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Publish via Composio** step above for detailed logs." >> "$GITHUB_STEP_SUMMARY"

name: Weekly Performance Report

# Runs every Sunday at 21:00 IST (15:30 UTC) to generate the weekly report.
# Aggregates data from history.json + analytics.json + replied_comments.json
# + dm_replied.json into a markdown report at reports/<year>-W<week>.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: print report preview but don't commit."
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "30 15 * * 0"    # Sunday 15:30 UTC = 21:00 IST

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/weekly_report.py \
            --history content/history.json \
            --analytics content/analytics.json \
            --replied content/replied_comments.json \
            --dm-replied content/dm_replied.json \
            --reports-dir reports \
            $DRY_FLAG

      - name: Commit report
        if: always()
        run: |
          bash scripts/git_push_retry.sh "report: weekly performance summary" "reports/" || true

name: Instagram Auto-Reply to Comments

# Runs every hour to scan recent posts for new comments and auto-reply with
# DM-inviting messages. Idempotent — never replies to the same comment twice
# (tracked in content/replied_comments.json).
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Scan posts published within the last N hours (default 48)"
        required: false
        default: "48"
      dry_run:
        description: "Dry-run: list comments that would be replied to, but don't reply."
        type: boolean
        required: false
        default: false

  schedule:
    # Every hour, on the hour. Cron is UTC.
    - cron: "0 * * * *"

permissions:
  contents: write
  issues: write   # for lead-alert Issue creation

concurrency:
  group: instagram-auto-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # For lead-alert GitHub Issue creation. GITHUB_TOKEN has limited scope
      # (can't create issues in some configs) — but for same-repo issues it
      # works fine. GH_PAT is a fallback if you want cross-repo issues.
      GH_PAT: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run auto-reply
        id: reply
        run: |
          HOURS="${{ github.event.inputs.hours || '48' }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/auto_reply.py \
            --history content/history.json \
            --replied content/replied_comments.json \
            --hours "$HOURS" \
            $DRY_FLAG

      - name: Commit replied_comments.json
        if: always()
        run: |
          git add content/replied_comments.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[INFO] No replied_comments changes to commit."
          else
            git commit -m "chore(auto-reply): updated replied comments tracker"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Instagram Auto-Reply Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hours scanned:** ${{ github.event.inputs.hours || '48' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.reply.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Replies are tracked in \`content/replied_comments.json\` (idempotency)." >> "$GITHUB_STEP_SUMMARY"
